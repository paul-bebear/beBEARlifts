    <!-- beBEARlifts fork: Rollbar, Google Analytics, the consent script and Apple sign-in are removed.
         The app still calls the global Rollbar.configure/error, so this no-op stub stands in for it. -->
    <script>
      window.Rollbar = { configure: function () {}, error: function () { console.error.apply(console, arguments); } };
    </script>
    <style>
      html,
      #app {
        height: 100%;
      }
      /* beBEARlifts fork: native-feeling touch on iOS Home Screen apps. */
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        background-color: #ffffff;
      }
      html.dark {
        background-color: #000000;
      }
      body {
        overscroll-behavior: none;
        -webkit-touch-callout: none;
      }
      [tabindex],
      button,
      a {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }
      /* data-pressed is set by src/utils/pressFeedback.ts while a finger is down. */
      [data-pressed] {
        opacity: 0.55;
        transition: opacity 0s;
      }
      input,
      textarea,
      [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      /* The system font is San Francisco on iPhone. Upstream sets Poppins on body with !important in
         @layer base, and an important rule in a layer beats an unlayered one, so this override sits in
         the same layer with a more specific selector. */
      @layer base {
        html body {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial,
            sans-serif !important;
        }
      }
      /* Monochrome option (Settings → Appearance). The root filter greys colours that components read from
         JS; on the root element it does not break fixed sheets. The variables keep accents black or white
         instead of mid-grey. Idea from yeivier/liftosaur-javier- (AGPL-3.0), commit fd3fe898e. */
      html.mono {
        filter: grayscale(1);
        --color-button-primarybackground: #000000;
        --color-menu-buttonprimary: #000000;
        --color-text-purple: #000000;
        --color-icon-purple: #000000;
        --color-menu-iconactive: #000000;
        --color-menu-labelactive: #000000;
        --color-text-link: #000000;
      }
      html.mono.dark {
        --color-button-primarybackground: #3a3a3c;
        --color-menu-buttonprimary: #3a3a3c;
        --color-text-purple: #ffffff;
        --color-icon-purple: #ffffff;
        --color-menu-iconactive: #ffffff;
        --color-menu-labelactive: #ffffff;
        --color-text-link: #ffffff;
      }
    </style>
